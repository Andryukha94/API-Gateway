server:
  port: 8088

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/flow

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: flow-manager
              uri: ${FLOW_MANAGER_URL:http://localhost:8081}
              predicates:
                - Path=/flow-manager/**
              filters:
                - StripPrefix=1